name: Validación del portafolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis JavaScript
        run: node --check script.js
      - name: Ejecutar pruebas
        run: node --test tests/*.test.mjs